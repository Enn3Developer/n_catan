name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          lfs: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: false
      - run: go -C updater test -race ./...
      - run: go -C updater vet ./...
      - run: python3 tools/build_updater.py --platform windows-x86_64 --output build/check/n-catan-updater.exe
      - name: Import Godot project
        run: |
          python3 tools/release.py bootstrap
          "$PWD/build/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --editor --import --quit
      - name: Rules tests
        run: '"$PWD/build/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tests/rules_test.gd'
